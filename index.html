<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cosmic Parlays Terminal</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: #131a2a;
      --border: #232f48;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #6366f1;
      --green: #10b981;
      --red: #ef4444;
      --gold: #f59e0b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 1rem; }
    header { max-width: 900px; margin: 0 auto 1.5rem; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 1rem; }
    h1 { font-size: 1.25rem; font-weight: 700; color: #fff; display: flex; align-items: center; gap: 0.5rem; }
    .status-badge { font-size: 0.75rem; padding: 0.25rem 0.6rem; border-radius: 9999px; background: rgba(16, 185, 129, 0.15); color: var(--green); border: 1px solid rgba(16, 185, 129, 0.3); }

    main { max-width: 900px; margin: 0 auto; display: grid; gap: 1.25rem; }
    .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 1.25rem; }
    .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
    .card-title { font-size: 1rem; font-weight: 600; color: #fff; }

    .balance-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; }
    .metric { background: rgba(255,255,255,0.02); border: 1px solid var(--border); border-radius: 8px; padding: 0.75rem 1rem; }
    .metric-label { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
    .metric-value { font-size: 1.25rem; font-weight: 700; color: #fff; margin-top: 0.25rem; }

    .spread-list { display: flex; flex-direction: column; gap: 0.75rem; }
    .spread-item { background: rgba(255,255,255,0.02); border: 1px solid var(--border); border-radius: 8px; padding: 1rem; display: flex; flex-direction: column; gap: 0.5rem; }
    .spread-title { font-size: 0.95rem; font-weight: 600; }
    .spread-details { display: flex; flex-wrap: wrap; justify-content: space-between; font-size: 0.85rem; color: var(--muted); gap: 0.5rem; }
    .edge-tag { font-weight: 700; color: var(--green); }

    .refresh-btn { background: var(--accent); color: #fff; border: none; padding: 0.4rem 0.8rem; border-radius: 6px; font-weight: 600; font-size: 0.8rem; cursor: pointer; }
    .refresh-btn:hover { opacity: 0.9; }
    .empty { color: var(--muted); font-size: 0.85rem; text-align: center; padding: 1.5rem; }
  </style>
</head>
<body>

  <header>
    <h1>🚀 Cosmic Parlays <span>Terminal</span></h1>
    <div style="display: flex; gap: 0.5rem; align-items: center;">
      <span class="status-badge" id="bot-status">Edge Engine Active</span>
      <button class="refresh-btn" onclick="fetchLiveData()">Refresh</button>
    </div>
  </header>

  <main>
    <!-- Balances Section -->
    <div class="card">
      <div class="card-header">
        <h2 class="card-title">Portfolio State</h2>
        <span style="font-size: 0.75rem; color: var(--muted);">Auto-Synching</span>
      </div>
      <div class="balance-grid">
        <div class="metric">
          <div class="metric-label">Polymarket (Settled)</div>
          <div class="metric-value" id="poly-balance">$2.57</div>
        </div>
        <div class="metric">
          <div class="metric-label">Kalshi (Available)</div>
          <div class="metric-value" id="kalshi-balance">$0.00</div>
        </div>
        <div class="metric">
          <div class="metric-label">Execution Guard</div>
          <div class="metric-value" style="color: var(--gold);">$10.00 Cap</div>
        </div>
      </div>
    </div>

    <!-- Active Markets & Spreads -->
    <div class="card">
      <div class="card-header">
        <h2 class="card-title">Live Scanned Market Spreads</h2>
        <span id="scan-count" style="font-size: 0.8rem; color: var(--muted);">0 events</span>
      </div>
      <div class="spread-list" id="spread-container">
        <div class="empty">Scanning live order books via Cloudflare Edge...</div>
      </div>
    </div>
  </main>

  <script>
    const WORKER_URL = "https://cosmic-parlays.cosmictrollgaming.workers.dev/api/live-data";

    async function fetchLiveData() {
      const container = document.getElementById("spread-container");
      const countLabel = document.getElementById("scan-count");
      
      try {
        const res = await fetch(WORKER_URL);
        const data = await res.json();
        
        const kalshi = data.kalshi || [];
        const poly = data.polymarket || [];
        countLabel.textContent = `${kalshi.length} Kalshi / ${poly.length} Poly`;

        if (kalshi.length === 0 && poly.length === 0) {
          container.innerHTML = `<div class="empty">No active markets returned. Check exchange API status.</div>`;
          return;
        }

        let html = "";
        let foundAny = false;

        // Display paired comparisons or open markets
        kalshi.forEach(k => {
          poly.forEach(p => {
            const kWords = k.title.toLowerCase().split(/\s+/);
            const matches = kWords.some(w => w.length > 3 && p.title.toLowerCase().includes(w));

            if (matches) {
              foundAny = true;
              const totalCost = k.yesAsk + p.noAsk;
              const netEdge = 1.00 - totalCost - 0.02;

              html += `
                <div class="spread-item">
                  <div class="spread-title">${k.title}</div>
                  <div class="spread-details">
                    <span>Kalshi Yes: <b>$${k.yesAsk.toFixed(2)}</b></span>
                    <span>Polymarket No: <b>$${p.noAsk.toFixed(2)}</b></span>
                    <span class="edge-tag">Net Edge: ${netEdge > 0 ? "+" : ""}${(netEdge * 100).toFixed(1)}¢</span>
                  </div>
                </div>
              `;
            }
          });
        });

        if (!foundAny) {
          // If no identical matched pairs, show raw active contracts
          html = kalshi.slice(0, 5).map(m => `
            <div class="spread-item">
              <div class="spread-title">[Kalshi] ${m.title}</div>
              <div class="spread-details">
                <span>Yes Ask: $${m.yesAsk.toFixed(2)}</span>
                <span>No Ask: $${m.noAsk.toFixed(2)}</span>
                <span>Status: Monitoring</span>
              </div>
            </div>
          `).join("");
        }

        container.innerHTML = html;
      } catch (err) {
        container.innerHTML = `<div class="empty" style="color: var(--red);">Error loading edge feed: ${err.message}</div>`;
      }
    }

    // Initial load
    fetchLiveData();
    // Poll every 30s
    setInterval(fetchLiveData, 30000);
  </script>
</body>
</html>
