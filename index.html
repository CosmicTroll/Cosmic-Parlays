<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cosmic Parlays Terminal</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: #131a2a;
      --border: #232f48;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #6366f1;
      --green: #10b981;
      --red: #ef4444;
      --gold: #f59e0b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 1rem; }
    
    header { max-width: 900px; margin: 0 auto 1.25rem; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 0.75rem; border-bottom: 1px solid var(--border); padding-bottom: 1rem; }
    .brand { display: flex; align-items: center; gap: 0.5rem; }
    h1 { font-size: 1.2rem; font-weight: 700; color: #fff; }
    .controls { display: flex; align-items: center; gap: 0.5rem; }
    .status-badge { font-size: 0.7rem; padding: 0.25rem 0.5rem; border-radius: 9999px; background: rgba(16, 185, 129, 0.15); color: var(--green); border: 1px solid rgba(16, 185, 129, 0.3); white-space: nowrap; }

    main { max-width: 900px; margin: 0 auto; display: grid; gap: 1.25rem; }
    .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 1.25rem; }
    .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
    .card-title { font-size: 1rem; font-weight: 600; color: #fff; }

    .balance-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 0.75rem; }
    .metric { background: rgba(255,255,255,0.02); border: 1px solid var(--border); border-radius: 8px; padding: 0.75rem 1rem; }
    .metric-label { font-size: 0.7rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
    .metric-value { font-size: 1.25rem; font-weight: 700; color: #fff; margin-top: 0.25rem; }

    /* Navigation Tabs */
    .tab-bar { display: flex; gap: 0.5rem; border-bottom: 1px solid var(--border); padding-bottom: 0.5rem; margin-bottom: 1rem; }
    .tab-btn { background: none; border: 1px solid transparent; color: var(--muted); padding: 0.4rem 0.8rem; border-radius: 6px; font-weight: 600; font-size: 0.8rem; cursor: pointer; }
    .tab-btn.active { background: rgba(99, 102, 241, 0.15); color: #fff; border-color: var(--accent); }

    .market-list { display: flex; flex-direction: column; gap: 0.75rem; }
    .market-item { background: rgba(255,255,255,0.02); border: 1px solid var(--border); border-radius: 8px; padding: 0.85rem; display: flex; flex-direction: column; gap: 0.5rem; }
    .market-title { font-size: 0.9rem; font-weight: 600; color: #f1f5f9; }
    .market-details { display: flex; flex-wrap: wrap; justify-content: space-between; font-size: 0.8rem; color: var(--muted); gap: 0.5rem; }
    .edge-tag { font-weight: 700; color: var(--green); }
    .platform-tag { font-size: 0.65rem; padding: 0.15rem 0.4rem; border-radius: 4px; background: rgba(255,255,255,0.08); text-transform: uppercase; }

    .refresh-btn { background: var(--accent); color: #fff; border: none; padding: 0.4rem 0.8rem; border-radius: 6px; font-weight: 600; font-size: 0.8rem; cursor: pointer; }
    .empty { color: var(--muted); font-size: 0.85rem; text-align: center; padding: 2rem 1rem; }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <h1>🚀 Cosmic Parlays</h1>
    </div>
    <div class="controls">
      <span class="status-badge" id="bot-status">Edge Engine Active</span>
      <button class="refresh-btn" onclick="fetchLiveData()">Refresh</button>
    </div>
  </header>

  <main>
    <!-- Balances Section -->
    <div class="card">
      <div class="card-header">
        <h2 class="card-title">Portfolio State</h2>
        <span style="font-size: 0.75rem; color: var(--muted);">Auto-Syncing</span>
      </div>
      <div class="balance-grid">
        <div class="metric">
          <div class="metric-label">Polymarket (Settled)</div>
          <div class="metric-value" id="poly-balance">$2.57</div>
        </div>
        <div class="metric">
          <div class="metric-label">Kalshi (Available)</div>
          <div class="metric-value" id="kalshi-balance">$0.00</div>
        </div>
        <div class="metric">
          <div class="metric-label">Execution Guard</div>
          <div class="metric-value" style="color: var(--gold);">$10.00 Cap</div>
        </div>
      </div>
    </div>

    <!-- Live Feeds & Tabs -->
    <div class="card">
      <div class="tab-bar">
        <button class="tab-btn active" onclick="setTab('spreads')">Matched Spreads</button>
        <button class="tab-btn" onclick="setTab('poly')">Polymarket Feed</button>
        <button class="tab-btn" onclick="setTab('kalshi')">Kalshi Feed</button>
      </div>

      <div class="card-header">
        <h2 class="card-title" id="tab-heading">Active Spreads</h2>
        <span id="scan-count" style="font-size: 0.8rem; color: var(--muted);">Loading...</span>
      </div>

      <div class="market-list" id="market-container">
        <div class="empty">Scanning live order books via Cloudflare Edge...</div>
      </div>
    </div>
  </main>

  <script>
    const WORKER_URL = "https://cosmic-parlays.cosmictrollgaming.workers.dev/api/live-data";
    let activeTab = "spreads";
    let latestData = { kalshi: [], polymarket: [] };

    function setTab(tab) {
      activeTab = tab;
      document.querySelectorAll(".tab-btn").forEach((btn, idx) => {
        btn.classList.toggle("active", (tab === "spreads" && idx === 0) || (tab === "poly" && idx === 1) || (tab === "kalshi" && idx === 2));
      });
      renderMarkets();
    }

    async function fetchLiveData() {
      const countLabel = document.getElementById("scan-count");
      try {
        const res = await fetch(WORKER_URL);
        latestData = await res.json();
        
        const kalshi = latestData.kalshi || [];
        const poly = latestData.polymarket || [];
        countLabel.textContent = `${kalshi.length} Kalshi / ${poly.length} Poly`;
        renderMarkets();
      } catch (err) {
        document.getElementById("market-container").innerHTML = `<div class="empty" style="color: var(--red);">Feed error: ${err.message}</div>`;
      }
    }

    function renderMarkets() {
      const container = document.getElementById("market-container");
      const heading = document.getElementById("tab-heading");
      const kalshi = latestData.kalshi || [];
      const poly = latestData.polymarket || [];

      let html = "";

      if (activeTab === "spreads") {
        heading.textContent = "Matched Arbitrage Spreads";
        let found = false;

        kalshi.forEach(k => {
          poly.forEach(p => {
            const kWords = k.title.toLowerCase().split(/\s+/);
            const matches = kWords.some(w => w.length > 3 && p.title.toLowerCase().includes(w));
            if (matches) {
              found = true;
              const totalCost = k.yesAsk + p.noAsk;
              const netEdge = 1.00 - totalCost - 0.02;
              html += `
                <div class="market-item">
                  <div class="market-title">${k.title}</div>
                  <div class="market-details">
                    <span>Kalshi Yes: <b>$${k.yesAsk.toFixed(2)}</b></span>
                    <span>Poly No: <b>$${p.noAsk.toFixed(2)}</b></span>
                    <span class="edge-tag">Net: ${netEdge > 0 ? "+" : ""}${(netEdge * 100).toFixed(1)}¢</span>
                  </div>
                </div>`;
            }
          });
        });

        if (!found) {
          html = `<div class="empty">No overlapping pairs between platforms right now. Check individual feeds via the tabs above!</div>`;
        }
      } else if (activeTab === "poly") {
        heading.textContent = "Polymarket Active Order Books";
        if (poly.length === 0) {
          html = `<div class="empty">No active Polymarket events returned.</div>`;
        } else {
          html = poly.map(p => `
            <div class="market-item">
              <div class="market-title"><span class="platform-tag">POLY</span> ${p.title}</div>
              <div class="market-details">
                <span>Yes: $${p.yesAsk.toFixed(2)}</span>
                <span>No: $${p.noAsk.toFixed(2)}</span>
                <span>ID: ${p.ticker.slice(0, 14)}...</span>
              </div>
            </div>`).join("");
        }
      } else if (activeTab === "kalshi") {
        heading.textContent = "Kalshi Active Order Books";
        if (kalshi.length === 0) {
          html = `<div class="empty">No Kalshi events currently pulled or API limit reached.</div>`;
        } else {
          html = kalshi.map(k => `
            <div class="market-item">
              <div class="market-title"><span class="platform-tag">KALSHI</span> ${k.title}</div>
              <div class="market-details">
                <span>Yes: $${k.yesAsk.toFixed(2)}</span>
                <span>No: $${k.noAsk.toFixed(2)}</span>
                <span>Ticker: ${k.ticker}</span>
              </div>
            </div>`).join("");
        }
      }

      container.innerHTML = html;
    }

    fetchLiveData();
    setInterval(fetchLiveData, 30000);
  </script>
</body>
</html>
