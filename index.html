<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cosmic Terminal</title>
  <link rel="manifest" href="/manifest.json">
  <style>
    :root {
      --bg-base: #060712;
      --bg-card: #0c1020;
      --bg-input: #12182d;
      --border-color: #1a2340;
      --text-main: #ffffff;
      --text-muted: #7987a5;
      --accent-cyan: #00f2fe;
      --accent-green: #00f5a0;
      --accent-pink: #ff007a;
      --accent-gold: #ffe600;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-base);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 16px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 16px;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 0.5px;
    }

    .tag {
      font-family: monospace;
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      background: #141f36;
      color: var(--accent-cyan);
    }

    .stat-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 14px;
    }

    .stat-box {
      background: #090d1a;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 10px 8px;
      text-align: center;
    }

    .stat-label {
      font-size: 10px;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-bottom: 4px;
      display: block;
    }

    .stat-value {
      font-size: 14px;
      font-weight: 800;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-bottom: 10px;
    }

    input, select {
      background: var(--bg-input);
      border: 1px solid var(--border-color);
      color: #fff;
      padding: 10px;
      border-radius: 6px;
      font-size: 12px;
      outline: none;
      width: 100%;
    }

    input:focus, select:focus {
      border-color: var(--accent-cyan);
    }

    .password-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .toggle-visibility {
      position: absolute;
      right: 10px;
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 11px;
    }

    .btn {
      background: #19223c;
      border: 1px solid var(--border-color);
      color: #fff;
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-gold {
      background: var(--accent-gold);
      color: #000;
      border: none;
    }

    .ticket-card {
      background: #080c18;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 12px;
      font-size: 12px;
    }
  </style>
</head>
<body>

<div class="container">

  <!-- BYOK VAULT SETTINGS PANEL (SECURED & MASKED) -->
  <div class="card" id="vault-panel">
    <div class="card-header">
      <span>🔐 BYOK VAULT SETTINGS</span>
      <span class="tag">100% Client-Side</span>
    </div>

    <div class="input-group">
      <label class="stat-label">Kalshi Key ID</label>
      <div class="password-wrapper">
        <input type="password" id="kalshi-key-id" placeholder="Paste Kalshi Key UUID..." autocomplete="off">
        <button type="button" class="toggle-visibility" onclick="toggleMask('kalshi-key-id')">👁</button>
      </div>
    </div>

    <div class="input-group">
      <label class="stat-label">Kalshi Private Key (RSA PEM)</label>
      <div class="password-wrapper">
        <input type="password" id="kalshi-private-key" placeholder="Paste Private Key PEM..." autocomplete="off">
        <button type="button" class="toggle-visibility" onclick="toggleMask('kalshi-private-key')">👁</button>
      </div>
    </div>

    <button class="btn btn-gold" style="width: 100%; margin-top: 4px;" onclick="saveVaultCredentials()">Save Credentials Locally</button>
  </div>

  <!-- FLEET TRACKER & INGESTION ROSTER -->
  <div class="card" id="fleet-tracker-panel">
    <div class="card-header">
      <span>🛡️ FLEET TRACKER &amp; INGESTION</span>
      <span class="tag" id="fleet-uuid-tag">ENDPOINT: Loading...</span>
    </div>

    <div class="stat-grid">
      <div class="stat-box">
        <span class="stat-label">Total Slips</span>
        <span class="stat-value" id="fleet-slips-count">0</span>
      </div>
      <div class="stat-box">
        <span class="stat-label">Active Risk</span>
        <span class="stat-value" id="fleet-risk-val">$0.00</span>
      </div>
      <div class="stat-box">
        <span class="stat-label">Gross Return</span>
        <span class="stat-value" id="fleet-payout-val" style="color: var(--accent-green);">$0.00</span>
      </div>
    </div>

    <!-- Ingest Controls -->
    <div style="display: flex; gap: 8px; margin-bottom: 12px; align-items: flex-end;">
      <div style="flex: 2;">
        <label class="stat-label">Manual Paste Fallback</label>
        <input type="text" id="manual-slip-input" placeholder="Paste receipt or share link...">
      </div>
      <div style="flex: 1;">
        <label class="stat-label">Retention (TTL)</label>
        <select id="user-ttl-select" onchange="updateTtlPreference()">
          <option value="300">5 Min</option>
          <option value="900">15 Min</option>
          <option value="1800" selected>30 Min</option>
          <option value="3600">1 Hour</option>
          <option value="86400">24 Hours</option>
        </select>
      </div>
      <button class="btn btn-gold" style="height: 38px;" onclick="ingestManualSlip()">Import</button>
    </div>

    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
      <span class="stat-label">Imported Wagers</span>
      <button class="btn" style="padding: 2px 8px; font-size: 10px;" onclick="pollSharedSlips()">Force Sync</button>
    </div>

    <div id="fleet-tickets-container" style="display: flex; flex-direction: column; gap: 8px;">
      <!-- Tickets rendered dynamically -->
    </div>
  </div>

</div>

<script>
// --- CREDENTIAL MASKING & VAULT STORAGE ---
function toggleMask(fieldId) {
  const el = document.getElementById(fieldId);
  if (el) el.type = el.type === 'password' ? 'text' : 'password';
}

function saveVaultCredentials() {
  const keyId = document.getElementById('kalshi-key-id').value.trim();
  const privKey = document.getElementById('kalshi-private-key').value.trim();

  if (keyId) localStorage.setItem('kalshi_key_id', keyId);
  if (privKey) localStorage.setItem('kalshi_private_key', privKey);
  alert("Credentials securely locked into local browser storage.");
}

function loadVaultCredentials() {
  const keyId = localStorage.getItem('kalshi_key_id');
  const privKey = localStorage.getItem('kalshi_private_key');
  if (keyId) document.getElementById('kalshi-key-id').value = keyId;
  if (privKey) document.getElementById('kalshi-private-key').value = privKey;
}

// --- UUID & RETENTION CONFIG ---
function getOrCreateClientUuid() {
  let uuid = localStorage.getItem('cosmic_fleet_uuid');
  if (!uuid) {
    uuid = 'cpt_' + crypto.randomUUID().slice(0, 12);
    localStorage.setItem('cosmic_fleet_uuid', uuid);
  }
  const tag = document.getElementById('fleet-uuid-tag');
  if (tag) tag.textContent = `ENDPOINT: ${uuid}`;
  return uuid;
}

function updateTtlPreference() {
  const select = document.getElementById('user-ttl-select');
  if (select) localStorage.setItem('cosmic_slip_ttl', select.value);
}

function getUserTtl() {
  return localStorage.getItem('cosmic_slip_ttl') || '1800';
}

// --- LOCAL ROSTER & METRICS ---
function loadLocalFleetTickets() {
  return JSON.parse(localStorage.getItem('cosmic_fleet_tickets') || '[]');
}

function saveLocalFleetTickets(tickets) {
  localStorage.setItem('cosmic_fleet_tickets', JSON.stringify(tickets));
  renderFleetTickets();
}

function updateFleetMetrics(tickets) {
  let totalRisk = 0;
  let totalPayout = 0;

  tickets.forEach(t => {
    if (typeof t.stake === 'number' && !isNaN(t.stake)) totalRisk += t.stake;
    if (typeof t.payout === 'number' && !isNaN(t.payout)) totalPayout += t.payout;
  });

  const countEl = document.getElementById('fleet-slips-count');
  const riskEl = document.getElementById('fleet-risk-val');
  const payoutEl = document.getElementById('fleet-payout-val');

  if (countEl) countEl.textContent = tickets.length;
  if (riskEl) riskEl.textContent = `$${totalRisk.toFixed(2)}`;
  if (payoutEl) payoutEl.textContent = `$${totalPayout.toFixed(2)}`;
}

function renderFleetTickets() {
  const container = document.getElementById('fleet-tickets-container');
  const tickets = loadLocalFleetTickets();
  updateFleetMetrics(tickets);

  if (!container) return;

  if (tickets.length === 0) {
    container.innerHTML = '<div style="color: var(--text-muted); font-size: 11px; padding: 12px; text-align: center; border: 1px dashed var(--border-color); border-radius: 6px;">No imported slips active.</div>';
    return;
  }

  container.innerHTML = tickets.map((t, idx) => `
    <div class="ticket-card">
      <div style="display: flex; justify-content: space-between; font-weight: bold; margin-bottom: 4px;">
        <span style="color: var(--accent-cyan);">${t.book} [${t.betId || 'Manual Slip'}]</span>
        <span style="color: var(--accent-gold);">${t.odds || ''} | Ret: $${t.payout ? t.payout.toFixed(2) : '--'}</span>
      </div>
      <div style="color: var(--text-muted); font-size: 10px; margin-bottom: 6px; display: flex; justify-content: space-between;">
        <span>Stake: $${t.stake ? t.stake.toFixed(2) : '--'} | ${new Date(t.timestamp).toLocaleTimeString()}</span>
        <span style="cursor: pointer; color: var(--accent-pink);" onclick="removeSlip(${idx})">✕ Remove</span>
      </div>
      <div style="padding-left: 8px; border-left: 2px solid var(--accent-pink);">
        ${(t.legs || []).map(l => `<div style="font-size: 11px; color: #fff;">• ${l}</div>`).join('')}
      </div>
    </div>
  `).join('');
}

function removeSlip(index) {
  const tickets = loadLocalFleetTickets();
  tickets.splice(index, 1);
  saveLocalFleetTickets(tickets);
}

// --- QUEUE POLLING & INGESTION ---
async function pollSharedSlips() {
  const uuid = getOrCreateClientUuid();
  try {
    const res = await fetch(`/api/fleet/pull/${uuid}`);
    if (!res.ok) return;
    const data = await res.json();
    if (data.pending && data.pending.length > 0) {
      const current = loadLocalFleetTickets();
      data.pending.forEach(item => {
        if (!current.some(c => c.id === item.id)) {
          current.unshift(item);
        }
      });
      saveLocalFleetTickets(current);
    }
  } catch (err) {
    console.warn("Poll deferred:", err);
  }
}

function ingestManualSlip() {
  const input = document.getElementById('manual-slip-input');
  if (!input || !input.value.trim()) return;

  const raw = input.value.trim();
  const ticket = {
    id: `manual_${Date.now()}`,
    book: raw.includes('DraftKings') ? 'DraftKings' : raw.includes('FanDuel') ? 'FanDuel' : 'Sportsbook',
    raw: raw,
    timestamp: Date.now(),
    legs: [raw.length > 120 ? raw.slice(0, 120) + '...' : raw]
  };

  const odds = raw.match(/([+-]\d{3,4})\b/);
  if (odds) ticket.odds = odds[1];
  const stake = raw.match(/(?:Wager|Stake|Amount):\s*\$([0-9.]+)/i);
  if (stake) ticket.stake = parseFloat(stake[1]);
  const payout = raw.match(/(?:Payout|To Win|Return):\s*\$([0-9.]+)/i);
  if (payout) ticket.payout = parseFloat(payout[1]);

  const current = loadLocalFleetTickets();
  current.unshift(ticket);
  saveLocalFleetTickets(current);
  input.value = '';
}

function checkIncomingShareTarget() {
  const params = new URLSearchParams(window.location.search);
  const text = params.get('share_text') || params.get('text');
  const url = params.get('share_url') || params.get('url');

  if (text || url) {
    const raw = `${text || ''} ${url || ''}`.trim();
    const ticket = {
      id: `share_${Date.now()}`,
      book: raw.includes('DraftKings') ? 'DraftKings' : raw.includes('FanDuel') ? 'FanDuel' : 'Sportsbook',
      raw: raw,
      timestamp: Date.now(),
      legs: [raw.length > 120 ? raw.slice(0, 120) + '...' : raw]
    };
    const current = loadLocalFleetTickets();
    current.unshift(ticket);
    saveLocalFleetTickets(current);
    window.history.replaceState({}, document.title, window.location.pathname);
  }
}

// --- INITIALIZATION ---
window.addEventListener('DOMContentLoaded', () => {
  loadVaultCredentials();
  getOrCreateClientUuid();
  const ttlSelect = document.getElementById('user-ttl-select');
  if (ttlSelect) ttlSelect.value = getUserTtl();
  renderFleetTickets();
  checkIncomingShareTarget();
  setInterval(pollSharedSlips, 10000);
});
</script>

</body>
</html>
