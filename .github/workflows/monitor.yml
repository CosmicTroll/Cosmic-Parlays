name: Market Monitor Bot

on:
  schedule:
    - cron: '0 * * * *'  # Runs every hour
  workflow_dispatch:      # Allows manual trigger button in GitHub

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run Market Monitor
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python monitor.py

      - name: Commit and push updates to website
        run: |
          git config --global user.name "CosmicBot"
          git config --global user.email "bot@cosmicparlay.com"
          git add index.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Auto-update scouting lines [skip ci]" && git push)
