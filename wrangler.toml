# ============================================================================
# COSMIC TERMINAL / PARLAYS - MASTER WRANGLER CONFIGURATION
# Production Edge Runtime, 60s Autonomous GET Sentinel & Telemetry Bindings
# ============================================================================

name = "cosmic-parlays"
main = "worker.js"
compatibility_date = "2024-09-01"
compatibility_flags = ["nodejs_compat"]

workers_dev = true

# ----------------------------------------------------------------------------
# 1. Autonomous Sentinel Cron Trigger
# Runs every minute using deterministic GET calls (Zero List Operations)
# ----------------------------------------------------------------------------
[triggers]
crons = ["* * * * *"]

# ----------------------------------------------------------------------------
# 2. KV Namespace Bindings
# ----------------------------------------------------------------------------
[[kv_namespaces]]
binding = "FLEET_KV"
id = "69ed72deb8474645b5c82cb177891d36"

# ----------------------------------------------------------------------------
# 3. Environment Variables
# ----------------------------------------------------------------------------
[vars]
ENVIRONMENT = "production"
BUILD_VERSION = "4.1.0-monolithic-master"
CORS_ALLOW_ORIGIN = "*"
DEFAULT_SLIP_TTL = "1800"

[build]
command = ""
watch_dir = "."

[observability]
enabled = true
head_sampling_rate = 1
