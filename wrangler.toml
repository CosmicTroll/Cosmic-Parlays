# ============================================================================
# COSMIC TERMINAL - MASTER WRANGLER CONFIGURATION
# Production Edge Runtime, 60s Autonomous Cron Sentinel & Telemetry Bindings
# ============================================================================
name = "cosmic-parlays"
main = "worker.js"
compatibility_date = "2024-09-01"
compatibility_flags = ["nodejs_compat"]

workers_dev = true

[triggers]
crons = ["* * * * *"]

[[kv_namespaces]]
binding = "FLEET_KV"
id = "c7d7ba4e59074d2b9634e7da471168ef"

[vars]
ENVIRONMENT = "production"
BUILD_VERSION = "4.0.0-modular-master"
CORS_ALLOW_ORIGIN = "*"
DEFAULT_SLIP_TTL = "1800"

[build]
command = ""
watch_dir = "."

[observability]
enabled = true
head_sampling_rate = 1
